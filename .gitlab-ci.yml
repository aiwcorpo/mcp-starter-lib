# Two jobs, because code from a merge request must not get the Docker socket or the main secrets:
#   verify-change  merge requests; plain runner without the socket, the Redis test left out.
#   verify-main    default branch; runner tagged docker-socket (the socket mounted, for Testcontainers), environment
#                  ci-main (protected).
# The cache of a merge request is a separate key and pull-only, so a merge request cannot plant files for the main job.
stages:
  - verify

default:
  image: maven:3.9.12-eclipse-temurin-25

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

verify-change:
  stage: verify
  cache:
    key: maven-change
    policy: pull
    paths: [.m2/repository]
  script:
    - ./mvnw -B verify '-Dtest=!RedisJtiReplayStoreTest'
  artifacts:
    when: always
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

verify-main:
  stage: verify
  tags: [docker-socket]
  environment:
    name: ci-main
  cache:
    key: maven-main
    policy: pull-push
    paths: [.m2/repository]
  script:
    - ./mvnw -B verify
  artifacts:
    when: always
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
