# Publishes a tagged release to GitHub Packages (Maven, group pl.aiwcorpo.mcp: mcp-platform, mcp-platform-bom,
# mcp-platform-starter, mcp-platform-test) and attaches a CycloneDX SBOM to the GitHub Release. Runs only on a v* tag;
# nothing is published from branches. Not run yet: the repository and the organization packages do not exist at the time of
# writing. The local tag v3.0.0-beta-11 predates this file in its present form and must not be pushed alone: the first public
# release is a new tag.
#
# Setup, once, in the repository settings:
#   - Environment "release": required reviewers (at least one person other than the one who pushes the tag) and a deployment
#     rule that allows only tags matching v*. The jobs publish and github-release wait for approval.
#   - Package access: the mcp-contracts packages are read with the GITHUB_TOKEN of the run (permissions: packages: read), not
#     with a personal access token kept as a secret. In the settings of each package of aiwcorpo/mcp-contracts (mcp-contracts,
#     mcp-cedar-entities, mcp-policy-bundle, mcp-manifest, mcp-contracts-parent): Package settings, "Manage Actions access", add
#     this repository (aiwcorpo/mcp-starter-lib) with the role Read. Without it the run cannot resolve the dependencies.
#
# Five jobs, each with the least it needs:
#   verify          contents: read, packages: read. Tests and dependencies run here.
#   build           contents: read, packages: read, no build cache. Builds the jars and uploads them with the poms as an artifact.
#   publish         packages: write, no checkout and no build: downloads that artifact and runs deploy-file, so no plugin, test or
#                   annotation processor of the repository ever sees the write token. The environment "release" is reviewed.
#   sbom            contents: read, packages: read. Builds the CycloneDX SBOM and uploads bom.json and bom.xml as an artifact.
#   github-release  contents: write, no checkout and no build tool: downloads the SBOM and runs gh release create.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-contracts
      MCP_MAVEN_REPOSITORY_USER: ${{ github.actor }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tag matches the project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(./mvnw -q -B -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)" = "$version"
      - name: Deployment signals on this runner (names only)
        run: |
          for name in INVOCATION_ID KUBERNETES_SERVICE_HOST KUBERNETES_SERVICE_PORT container; do
            if [ -n "${!name:-}" ]; then echo "present: $name"; fi
          done
          for file in /.dockerenv /run/.containerenv; do
            if [ -e "$file" ]; then echo "present: $file"; fi
          done
          true
      # The hosted runner is a systemd service, so INVOCATION_ID is set in its steps and the tests that expect a developer's machine
      # skip themselves; ci/run.sh release refuses a run with skipped tests. Only the variable of the runner service is removed for
      # this one process, and only here: the starter reads the real environment of the server it protects, and a production
      # server keeps its signal. A container or a pod signal would still make the run refuse, which is intended.
      - name: Verify (tests with the Redis container, no skipped test)
        run: env -u INVOCATION_ID ci/run.sh release

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-contracts
      MCP_MAVEN_REPOSITORY_USER: ${{ github.actor }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1; no build cache: what this job produces is published
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      - name: Build the jars (the tests ran in verify)
        run: ./mvnw -B -s .ci/settings.xml package -DskipTests
      - name: Stage the files to publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p stage/mcp-platform stage/mcp-platform-bom stage/mcp-platform-starter stage/mcp-platform-test
          cp pom.xml stage/mcp-platform/pom.xml
          cp mcp-platform-bom/pom.xml stage/mcp-platform-bom/pom.xml
          for module in mcp-platform-starter mcp-platform-test; do
            cp "$module/pom.xml" "stage/$module/pom.xml"
            cp "$module/target/$module-$version.jar" "stage/$module/$module-$version.jar"
          done
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maven-artifacts
          path: stage
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      # actions/setup-java v4.7.1; only for the settings.xml with the server "github" (credentials from the environment of the step)
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maven-artifacts
          path: stage
      # Only uploads the files built in the read-only job: no project is built here, so no plugin, test or annotation
      # processor of the repository runs with the write token. deploy-file reads the pom and uploads the pom, the jar and
      # their checksums.
      - name: Upload the artifacts to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
          deploy="org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file"
          cd stage
          for module in mcp-platform mcp-platform-bom; do
            mvn -B "$deploy" -Durl="$url" -DrepositoryId=github -Dfile="$module/pom.xml" -DpomFile="$module/pom.xml" -Dpackaging=pom
          done
          for module in mcp-platform-starter mcp-platform-test; do
            mvn -B "$deploy" -Durl="$url" -DrepositoryId=github -Dfile="$module/$module-$version.jar" -DpomFile="$module/pom.xml"
          done

  sbom:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-contracts
      MCP_MAVEN_REPOSITORY_USER: ${{ github.actor }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      - name: SBOM (CycloneDX)
        run: ./mvnw -B -s .ci/settings.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error

  github-release:
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom
      - name: Create the GitHub Release with the SBOM
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}" bom.json bom.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
